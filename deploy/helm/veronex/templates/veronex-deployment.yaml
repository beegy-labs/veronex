apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-veronex
  labels:
    {{- include "veronex.labels" . | nindent 4 }}
    {{- include "veronex.api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.veronex.replicaCount }}
  selector:
    matchLabels:
      {{- include "veronex.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veronex.labels" . | nindent 8 }}
        {{- include "veronex.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.builder.enabled }}
      serviceAccountName: {{ .Release.Name }}-builder-controller
      {{- else }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-veronex" .Release.Name) }}
      {{- end }}
      {{- end }}
      containers:
        - name: veronex
          image: "{{ .Values.veronex.image.repository }}:{{ .Values.veronex.image.tag }}"
          imagePullPolicy: {{ .Values.veronex.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.veronex.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if and .Values.externalSecrets.csi.enabled .Values.externalSecrets.csi.syncAsSecret }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "veronex.secretName" . }}
          env:
            {{- if .Values.builder.enabled }}
            - name: BUILDER_NAMESPACE
              value: {{ .Values.builder.namespace | default .Release.Namespace | quote }}
            - name: BUILDER_PVC
              value: {{ .Values.builder.pvc | quote }}
            - name: BUILDER_RUNNER_IMAGE
              value: {{ .Values.builder.runnerImage | quote }}
            - name: BUILDER_RUNNER_SECRET
              value: {{ .Values.builder.existingSecretName | default (printf "%s-builder-runner" .Release.Name) | quote }}
            - name: BUILDER_POD_SERVICE_ACCOUNT
              value: {{ .Release.Name }}-builder-runtime
            - name: BUILDER_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builder.existingSecretName | default (printf "%s-builder-runner" .Release.Name) }}
                  key: RUNNER_TOKEN
            - name: BUILDER_PREVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builder.existingSecretName | default (printf "%s-builder-runner" .Release.Name) }}
                  key: PREVIEW_TOKEN
            - name: BUILDER_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.builder.existingSecretName | default (printf "%s-builder-runner" .Release.Name) }}
                  key: GIT_TOKEN
            - name: BUILDER_GIT_HOSTS
              value: {{ .Values.builder.gitHosts | quote }}
            - name: BUILDER_BROWSER_ORIGIN
              value: {{ .Values.builder.browserOrigin | quote }}
            - name: BUILDER_PREVIEW_DOMAIN
              value: {{ .Values.builder.previewDomain | quote }}
            - name: BUILDER_PREVIEW_SCHEME
              value: {{ ternary "https" "http" (ne .Values.builder.previewTlsSecret "") | quote }}
            - name: BUILDER_MAX_ACTIVE_WORKSPACES
              value: {{ .Values.builder.maxActiveWorkspaces | quote }}
            - name: BUILDER_MAX_PREVIEWS
              value: {{ .Values.builder.maxPreviewsPerWorkspace | quote }}
            - name: BUILDER_CLI_MEMORY_LIMIT
              value: {{ .Values.builder.cliMemoryLimit | quote }}
            - name: BUILDER_PREVIEW_MEMORY_LIMIT
              value: {{ .Values.builder.previewMemoryLimit | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.veronex.logLevel | default "info" | quote }}
            - name: PORT
              value: "{{ .Values.veronex.service.port }}"
            - name: VALKEY_URL
              value: {{ include "veronex.valkeyUrl" . | quote }}
            - name: ANALYTICS_URL
              value: "http://{{ .Release.Name }}-veronex-analytics:{{ .Values.veronexAnalytics.service.port }}"
            - name: S3_ENDPOINT
              value: {{ include "veronex.s3Endpoint" . | quote }}
            - name: S3_BUCKET
              value: {{ include "veronex.s3Bucket" . | quote }}
            - name: S3_IMAGE_BUCKET
              value: {{ include "veronex.s3ImageBucket" . | quote }}
            {{- if .Values.veronex.imagePublicUrl }}
            - name: S3_IMAGE_PUBLIC_URL
              value: {{ .Values.veronex.imagePublicUrl | quote }}
            {{- end }}
            - name: S3_REGION
              value: {{ include "veronex.s3Region" . | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.veronex.cors.allowedOrigins | quote }}
            {{- if .Values.veronex.sessionGroupingIntervalSecs }}
            - name: SESSION_GROUPING_INTERVAL_SECS
              value: {{ .Values.veronex.sessionGroupingIntervalSecs | quote }}
            {{- end }}
            {{- if .Values.veronex.bootstrapSuperUser }}
            - name: BOOTSTRAP_SUPER_USER
              value: {{ .Values.veronex.bootstrapSuperUser | quote }}
            {{- end }}
            {{- if .Values.veronex.bootstrapSuperPass }}
            - name: BOOTSTRAP_SUPER_PASS
              {{- if or .Values.externalSecrets.eso.enabled .Values.externalSecrets.csi.enabled .Values.externalSecrets.existingSecretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "veronex.secretName" . }}
                  key: BOOTSTRAP_SUPER_PASS
                  optional: true
              {{- else }}
              value: {{ .Values.veronex.bootstrapSuperPass | quote }}
              {{- end }}
            {{- end }}
            {{- if or .Values.otelCollector.enabled .Values.veronex.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "veronex.otelEndpoint" . | quote }}
            {{- end }}
            {{- if .Values.vespa.enabled }}
            - name: VESPA_URL
              value: {{ .Values.vespa.url | default (printf "http://%s-vespa:8080" .Release.Name) | quote }}
            {{- else if .Values.vespa.url }}
            - name: VESPA_URL
              value: {{ .Values.vespa.url | quote }}
            {{- end }}
            {{- if or .Values.vespa.enabled .Values.vespa.url }}
            - name: VESPA_ENVIRONMENT
              value: {{ .Values.veronex.vespaEnvironment | default "prod" | quote }}
            - name: VESPA_TENANT_ID
              value: {{ .Values.veronex.vespaTenantId | default "default" | quote }}
            {{- end }}
            {{- if (include "veronex.embedUrl" .) }}
            - name: EMBED_URL
              value: {{ include "veronex.embedUrl" . | quote }}
            {{- end }}
            {{- if or .Values.redpandaEnabled .Values.externalRedpanda.brokers }}
            - name: KAFKA_BROKER
              value: {{ include "veronex.redpandaBroker" . | quote }}
            {{- end }}
            {{- if or .Values.clickhouse.enabled .Values.externalClickhouse.host }}
            - name: CLICKHOUSE_HTTP_URL
              value: {{ include "veronex.clickhouseUrl" . | quote }}
            {{- $secretName := .Values.externalSecrets.existingSecretName | default (printf "%s-veronex-secrets" .Release.Name) }}
            {{- if or .Values.externalSecrets.eso.enabled .Values.externalSecrets.csi.enabled .Values.externalSecrets.existingSecretName }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: CLICKHOUSE_PASSWORD
            {{- else }}
            - name: CLICKHOUSE_USER
              value: {{ include "veronex.clickhouseUser" . | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ include "veronex.clickhousePassword" . | quote }}
            {{- end }}
            - name: CLICKHOUSE_DB
              value: {{ include "veronex.clickhouseDb" . | quote }}
            {{- end }}
            - name: VERONEX_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.veronex.valkeyPoolSize }}
            - name: VALKEY_POOL_SIZE
              value: {{ .Values.veronex.valkeyPoolSize | quote }}
            {{- end }}
            {{- if .Values.veronex.valkeyKeyPrefix }}
            - name: VALKEY_KEY_PREFIX
              value: {{ .Values.veronex.valkeyKeyPrefix | quote }}
            {{- end }}
            {{- if .Values.veronex.pgPoolMax }}
            - name: PG_POOL_MAX
              value: {{ .Values.veronex.pgPoolMax | quote }}
            {{- end }}
            {{- if .Values.veronex.loginRateLimit }}
            - name: LOGIN_RATE_LIMIT
              value: {{ .Values.veronex.loginRateLimit | quote }}
            {{- end }}
            {{- if .Values.veronex.visionFallbackModel }}
            - name: VISION_FALLBACK_MODEL
              value: {{ .Values.veronex.visionFallbackModel | quote }}
            {{- end }}
            {{- if .Values.veronex.mcpVectorTopK }}
            - name: MCP_VECTOR_TOP_K
              value: {{ .Values.veronex.mcpVectorTopK | quote }}
            {{- end }}
            {{- range $k, $v := .Values.veronex.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.veronex.resources | nindent 12 }}
      {{- if and .Values.externalSecrets.csi.enabled .Values.externalSecrets.csi.syncAsSecret }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-veronex-secrets
      {{- end }}
